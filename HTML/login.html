<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nintendo Switch | Login</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="icon" href="../IMGS/icon.png">
</head>

<body>

    <!--Header-->

    <div class="header">
        <div class="container">
            <h1 class="titulo">Nintendo Switch</h1>
            <ul class="navbar">
                <li>
                    <a href="/HTML/home.html">Home</a>
                </li>
                <li>
            <a href="/HTML/dashboard.html">Dashboard</a>
          </li>
                <li class="agora">
                    <a href="#">Login</a>
                </li>
                <li>
                    <a href="/HTML/cadastro.html">Cadastro</a>
                </li>
            </ul>
        </div>
    </div>


    <div class="console">
        <div class="container">

            <h2 class="titulo-form">Que bom ter você de volta!</h2>

            <div class="corpo">

                <!-- LADO ESQUERDO -->
                <div class="lado esquerdo">
                </div>

                <!-- CENTRO (FORMULÁRIO) -->
                <div class="centro">

                    <div class="formulario">
                        <div class="campo">
                            <span>E-mail:</span>
                            <input id="email_input" type="text" placeholder="Endereço de e-mail">
                        </div>

                        <div class="campo">
                            <span>Senha:</span>
                            <input id="senha_input" type="password" placeholder="******">
                        </div>

                        <button class="botao" onclick="entrar()">Entrar</button>
                        <div id="mensagem_erro"></div>
                    </div>
                </div>

                <!-- LADO DIREITO -->
                <div class="lado direito">
                </div>

            </div>

            </div>

        </div>



    <!--footer inicio-->
    <div class="footer">
        <div class="container">
            <h4>Que bom que você voltou! &hearts;</h4>
        </div>
    </div>
    <!--footer fim-->

</body>

<script>

function entrar() {

    mensagem_erro.innerHTML = "";

    var emailVar = email_input.value;
    var senhaVar = senha_input.value;

    if (emailVar == "" || senhaVar == "") {

        mensagem_erro.className = "erro";
        mensagem_erro.innerHTML = "Preencha todos os campos!";

        return false;
    }else {

    setInterval(sumirMensagem, 5000);
}

    if (!emailVar.includes("@")) {

        mensagem_erro.className = "erro";
        mensagem_erro.innerHTML = "E-mail inválido!";

        return false;
    }

    console.log("FORM LOGIN:", emailVar);
    console.log("FORM SENHA:", senhaVar);

    fetch("/usuarios/autenticar", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            emailServer: emailVar,
            senhaServer: senhaVar
        })

    })

    .then(function (resposta) {

        console.log("ESTOU NO THEN DO entrar()!");
        console.log("resposta:", resposta);

        if (resposta.ok) {

            resposta.json().then(json => {

                console.log(json);
                console.log(JSON.stringify(json));

                sessionStorage.EMAIL_USUARIO = json.email;
                sessionStorage.NOME_USUARIO = json.omeUsuario;
                sessionStorage.ID_USUARIO = json.idUsuario;

                mensagem_erro.className = "sucesso";
                mensagem_erro.innerHTML = "Login realizado com sucesso!";

                setTimeout(() => {

                    window.location = "/HTML/game.html";

                }, 1000);

            });

        } else {

            console.log("Houve um erro ao tentar realizar o login!");

            mensagem_erro.className = "erro";
            mensagem_erro.innerHTML = "E-mail ou senha inválidos!";
        }

    })

    .catch(function (erro) {

        console.log(`#ERRO: ${erro}`);

        mensagem_erro.className = "erro";
        mensagem_erro.innerHTML = "Erro no servidor!";
    });

    return false;
}

function sumirMensagem() {

    mensagem_erro.innerHTML = "";
}

</script>

</html>
