<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Nintendo Switch | Cadastro</title>

    <script src="./js/sessao.js"></script>


    <link rel="stylesheet" href="../CSS/style.css" />
    <link rel="icon" href="../IMGS/icon.png" />
</head>

<body>
    <!--header inicio-->
    <div class="header">
        <div class="container">
            <h1 class="titulo">Nintendo Switch</h1>
            <ul class="navbar">
                <li>
                    <a href="/HTML/home.html">Home</a>
                </li>
                <li>
                    <a href="/HTML/dashboard.html">Dashboard</a>
                </li>
                <li>
                    <a href="/HTML/login.html">Login</a>
                </li>
                <li class="agora">
                    <a href="#">Cadastro</a>
                </li>
            </ul>
        </div>
    </div>
    <!--header fim-->

    <div class="console">
        <div class="container">

            <h2 class="titulo-form">Boas-vindas!</h2>

            <div class="corpo">

                <div class="lado esquerdo">

                    <div class="analogico"></div>

                    <div class="botoes-esquerda">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                </div>

                <div class="centro">
                    <div class="formulario">


                        <div class="campo">
                            <span>Nome de Usuário:</span>
                            <input id="nome_input" type="text" placeholder="Seja criativo!" />
                        </div>
                        <div class="campo">
                            <span>E-mail:</span>
                            <input id="email_input" type="text" placeholder="Endereço de e-mail" />
                        </div>
                        <div class="campo">
                            <span>Senha:</span>
                            <input id="senha_input" type="password" placeholder="******" />
                        </div>
                        <div class="campo">
                            <span>Confirmação da Senha:</span>
                            <input id="confirmacao_senha_input" type="password" placeholder="******" />
                        </div>
                        <button class="botao" onclick="cadastrar()">Cadastrar</button>
                        <div id="mensagem_erro"></div>
                    </div>
                </div>


                <div class="lado direito">

                    <div class="analogico direito"></div>

                    <div class="botoes-direita">

                        <span class="topo"></span>

                        <div class="meio">
                            <span></span>
                            <span></span>
                        </div>

                        <span class="baixo"></span>

                    </div>

                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="container">
            <h4>Code by Roberta Karakawa © Projeto Individual &hearts;</h4>
        </div>
    </div>
</body>

<script>

    function cadastrar() {

        mensagem_erro.innerHTML = "";

        var nomeVar = nome_input.value;
        var emailVar = email_input.value;
        var senhaVar = senha_input.value;
        var confirmacaoSenhaVar = confirmacao_senha_input.value;

        if (
            nomeVar == "" ||
            emailVar == "" ||
            senhaVar == "" ||
            confirmacaoSenhaVar == ""
        ) {

            mensagem_erro.className = "erro";
            mensagem_erro.innerHTML = "Preencha todos os campos!";

            return false;

        } else {

            setInterval(sumirMensagem, 5000);
        }

        if (!emailVar.includes("@")) {

            mensagem_erro.className = "erro";
            mensagem_erro.innerHTML = "E-mail inválido!";

            return false;
        }

        if (senhaVar != confirmacaoSenhaVar) {

            mensagem_erro.className = "erro";
            mensagem_erro.innerHTML = "As senhas não coincidem!";

            return false;
        }

        console.log("FORM CADASTRO:", nomeVar);
        console.log("FORM EMAIL:", emailVar);

        fetch("/usuarios/cadastrar", {

            method: "POST",

            headers: {
                "Content-Type": "application/json",
            },

            body: JSON.stringify({

                nomeServer: nomeVar,
                emailServer: emailVar,
                senhaServer: senhaVar

            }),

        })

            .then(function (resposta) {

                console.log("resposta:", resposta);

                if (resposta.ok) {

                    mensagem_erro.className = "sucesso";

                    mensagem_erro.innerHTML =
                        "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

                    setTimeout(() => {

                        window.location = "/HTML/login.html";

                    }, 2000);

                } else {

                    throw "Houve um erro ao tentar realizar o cadastro!";
                }

            })

            .catch(function (erro) {

                console.log(`#ERRO: ${erro}`);

                mensagem_erro.className = "erro";
                mensagem_erro.innerHTML = "Erro ao realizar cadastro!";
            });

        return false;
    }

    function sumirMensagem() {

        mensagem_erro.innerHTML = "";
    }

</script>

</html>
