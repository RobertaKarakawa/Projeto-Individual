<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nintendo Switch | Perfil Gamer</title>

  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="icon" href="../IMGS/icon.png">
</head>

<body>
  <div class="header">
    <div class="container">
      <h1 class="titulo">Nintendo Switch</h1>
      <ul class="navbar navbarPerfil">
        <li class="agora">
          <a href="#">GameList</a>
        </li>
        <li>
          <a href="/HTML/quiz.html">Quizes</a>
        </li>
      </ul>
    </div>
  </div>


  <div class="paginaGame">

  
  <!-- LISTA -->
  <div class="listaJogos">

    <h1>GAME LIST</h1>

    <div class="gamesGrid">

      <!-- CARD -->
      <div class="cardGame">

        <img src="../IMGS/animalcrossing.jpg">

        <div class="conteudoGame">

          <h2>Animal Crossing: New Horizons</h2>

          <p>Simulação de vida</p>

          <button class="btnFav">♡ Favoritar</button>

          <select>
            <option>Não iniciado</option>
            <option>Jogando</option>
            <option>Zerado</option>
            <option>Platinado</option>
          </select>

          <select>
            <option>Nota</option>
            <option>⭐ 1</option>
            <option>⭐ 2</option>
            <option>⭐ 3</option>
            <option>⭐ 4</option>
            <option>⭐ 5</option>
          </select>

        </div>

      </div>

    </div>
</div>


     <div class="cardPerfil">

      <div class="fotoPerfil"></div>

      <h2>Player Arissa</h2>

      <p class="status">
        <span class="bolinha"></span>
        Online
      </p>

      <div class="tagJogador">
        ⭐ Super Jogador
      </div>

      <p class="frase">
        “Pronto para a próxima aventura.”
      </p>

    </div>



</div>

  <div class="footer">
    <div class="container">
      <h4>Espero que tenha gostado! &hearts;</h4>
    </div>
  </div>
</body>

<script>

  const favoritos = document.querySelectorAll('.btnFav');

  favoritos.forEach(botao => {

    botao.addEventListener('click', () => {

      botao.classList.toggle('ativo');

    });

  });

</script>


</html>
